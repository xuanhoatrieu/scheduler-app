services:
  # --- Dịch vụ Backend API ---
  scheduler-api:
    image: ghcr.io/xuanhoatrieu/scheduler-api:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: scheduler-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      # Đọc toàn bộ chuỗi kết nối DB_URI từ file .env
      DB_URI: ${DB_URI}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DATA_SOURCE: ${DATA_SOURCE:-database}
      NAMVIET_API_URL: ${NAMVIET_API_URL}
      NAMVIET_SECRET_KEY: ${NAMVIET_SECRET_KEY}
      NAMVIET_MA_TRUONG: ${NAMVIET_MA_TRUONG}
      NAMVIET_USERNAME: ${NAMVIET_USERNAME}
      TUAF_DB_SERVER: ${TUAF_DB_SERVER}
      TUAF_DB_USER: ${TUAF_DB_USER}
      TUAF_DB_PASSWORD: ${TUAF_DB_PASSWORD}
      TUAF_DB_NAME: ${TUAF_DB_NAME}
    networks:
      - tuaf-ai-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

# Sử dụng mạng lưới chung có sẵn của máy chủ TUAF Server (kết nối proxy Caddy và Supabase)
networks:
  tuaf-ai-network:
    external: true
    name: tuaf-ai-network
